name: Import approved item artwork
on:
  push:
    paths:
      - '.github/item-art-import.json'
permissions:
  contents: write
concurrency:
  group: import-item-art
  cancel-in-progress: false
jobs:
  import:
    if: github.event.head_commit.message == 'Prepare approved item artwork import'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import original transparent PNGs and apply item displays
        run: |
          python3 - <<'PY'
          import json, pathlib, urllib.request, struct, subprocess, time
          config = json.loads(pathlib.Path('.github/item-art-import.json').read_text())
          for item in config['assets']:
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(item['url'], timeout=60) as response:
                          data = response.read()
                      break
                  except Exception:
                      if attempt == 2:
                          raise
                      time.sleep(2)
              if len(data) != item['size'] or data[:8] != b'\x89PNG\r\n\x1a\n':
                  raise ValueError('Invalid asset: ' + item['path'])
              width, height = struct.unpack('>II', data[16:24])
              if not width or not height or data[25] not in (4, 6):
                  raise ValueError('Expected transparent PNG: ' + item['path'])
              target = pathlib.Path(item['path'])
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
              print('Imported', item['path'], width, height)
          for item in config['files']:
              pathlib.Path(item['path']).write_text(item['content'])
          pathlib.Path('.github/item-art-import.json').unlink()
          pathlib.Path('.github/workflows/import-item-art.yml').unlink()
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'add', 'assets/items', 'app.js', 'styles.css', 'index.html', '.github'], check=True)
          subprocess.run(['git', 'commit', '-m', 'Replace item placeholders with six transparent Veyrak artworks'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:main'], check=True)
          PY
